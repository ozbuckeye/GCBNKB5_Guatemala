<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify you are human</title>
<style>
  :root {
    --border: #d3d3d3;
    --blue: #4285f4;
    --blue-dark: #3367d6;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --bg: #f0f2f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: Roboto, Arial, Helvetica, sans-serif;
    color: var(--text);
  }

  /* ---- Stage 1: checkbox widget ---- */
  #checkboxWidget {
    width: 302px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fff;
    box-shadow: 0 0 4px rgba(0,0,0,0.08);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
  }
  #checkboxWidget .box {
    width: 28px;
    height: 28px;
    border: 2px solid #c1c1c1;
    border-radius: 2px;
    background: #fff;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #checkboxWidget .box svg { display: none; width: 20px; height: 20px; }
  #checkboxWidget .label { font-size: 14px; color: #3c4043; }
  #checkboxWidget .sub { margin-left: auto; text-align: center; opacity: 0.55; }
  #checkboxWidget .sub .badge {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid #999; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #999; font-weight: bold;
  }
  #checkboxWidget .sub .fine { font-size: 8px; color: #999; margin-top: 2px; }
  #checkboxWidget.checking .box { border-color: var(--blue); }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid #dcdcdc;
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Stage 2: challenge panel ---- */
  #challenge {
    display: none;
    width: 300px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fff;
    box-shadow: 0 0 8px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  #challenge .prompt {
    background: #4a4a4a;
    color: #fff;
    padding: 12px 16px;
    font-size: 15px;
    line-height: 1.35;
  }
  #challenge .prompt .strong { font-weight: 500; }
  #challenge .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    background: #4a4a4a;
  }
  #challenge .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    cursor: pointer;
    background: #333;
  }
  #challenge .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #challenge .tile .tick {
    position: absolute;
    top: 4px; right: 4px;
    width: 20px; height: 20px;
    background: var(--blue);
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
  }
  #challenge .tile .tick svg { width: 14px; height: 14px; }
  #challenge .tile.selected {
    box-shadow: inset 0 0 0 3px var(--blue);
  }
  #challenge .tile.selected .tick { display: flex; }

  #challenge .footer {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    border-top: 1px solid #eee;
  }
  #challenge .icon-btn {
    width: 34px; height: 34px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #757575;
  }
  #challenge .icon-btn:hover { background: #f1f1f1; }
  #challenge .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
  #challenge .spacer { flex: 1; }
  #challenge .msg {
    font-size: 11px;
    color: #d93025;
    padding: 0 4px;
    min-height: 14px;
    flex: 1;
  }
  #challenge .verify {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 10px 24px;
    font-size: 14px;
    border-radius: 2px;
    cursor: pointer;
  }
  #challenge .verify:hover { background: var(--blue-dark); }

  #debugBadge {
    position: fixed;
    bottom: 10px;
    left: 10px;
    background: #111;
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    opacity: 0.85;
    display: none;
    max-width: 280px;
  }
</style>
</head>
<body>

<!-- Stage 1: the classic "I'm not a robot" checkbox -->
<div id="checkboxWidget">
  <div class="box">
    <div class="spinner"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="#4285f4" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>
  </div>
  <div class="label">I'm not a robot</div>
  <div class="sub">
    <div class="badge">?</div>
    <div class="fine">Verify</div>
  </div>
</div>

<!-- Stage 2: the image challenge -->
<div id="challenge">
  <div class="prompt">
    <div id="promptText"></div>
    <div style="font-size:12px; opacity:0.8; margin-top:2px;">If there are none, click Verify.</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer">
    <button class="icon-btn" id="reloadBtn" title="Get a new challenge">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L14 11h7V4l-3.35 2.35z"/></svg>
    </button>
    <div class="msg" id="msg"></div>
    <button class="verify" id="verifyBtn">Verify</button>
  </div>
</div>

<div id="debugBadge"></div>

<script>
/* =========================================================================
   CONFIG — this is the only section you should need to edit.
   ========================================================================= */
const CONFIG = {
  // A shared fallback pool of "nothing to see here" photos, used by any
  // category below that doesn't define its own emptyImages.
  defaultEmptyImages: [
    'images/street1.jpg',
    'images/street2.jpg',
    'images/street3.jpg',
    'images/street4.jpg',
    'images/street5.jpg',
    'images/street6.jpg',
    'images/street7.jpg',
    'images/street8.jpg',
    'images/street9.jpg'
  ],

  // One entry per target category. Add as many as you like — one is chosen
  // at random on every full page load (won't repeat the same one twice in a
  // row). Each category has its OWN 15-digit sequence, so you can spread a
  // longer puzzle across categories, or reuse the same sequence in more than
  // one category if you'd rather have redundancy instead.
  //
  // digitSequence: digit 1-9 -> bus/hydrant/etc. sits in that keypad position
  // (1=top-left, 2=top-mid, 3=top-right, 4=mid-left, ... 9=bottom-right).
  // digit 0 -> nothing there; Verify always fails and auto-advances.
  categories: [
    {
      name: 'buses',
      prompt: 'Select all squares with <span class="strong">buses</span>',
      digitSequence: [3, 3, 3, 3, 7, 9, 0, 1, 5, 1, 0, 3, 8, 9, 3], // REPLACE
      targetImages: [
        'images/bus1.jpg',
        'images/bus2.jpg',
        'images/bus3.jpg'
      ]
      // emptyImages: [ ... ]   // optional per-category override
    },
    {
      name: 'fire hydrants',
      prompt: 'Select all squares with <span class="strong">fire hydrants</span>',
      digitSequence: [7, 2, 0, 5, 1, 9, 0, 3, 6, 8, 0, 4, 2, 1, 0], // REPLACE
      targetImages: [
        'images/hydrant1.jpg',
        'images/hydrant2.jpg',
        'images/hydrant3.jpg'
      ]
    },
    {
      name: 'motorcycles',
      prompt: 'Select all squares with <span class="strong">motorcycles</span>',
      digitSequence: [1, 6, 0, 9, 3, 5, 0, 8, 2, 4, 0, 7, 1, 5, 0], // REPLACE
      targetImages: [
        'images/motorcycle1.jpg',
        'images/motorcycle2.jpg',
        'images/motorcycle3.jpg'
      ]
    },
    {
      name: 'traffic lights',
      prompt: 'Select all squares with <span class="strong">traffic lights</span>',
      digitSequence: [9, 4, 0, 2, 6, 1, 0, 5, 8, 3, 0, 7, 9, 2, 0], // REPLACE
      targetImages: [
        'images/trafficlight1.jpg',
        'images/trafficlight2.jpg',
        'images/trafficlight3.jpg'
      ]
    }
  ],

  // How long (ms) to show the "Verified" / auto-advance pause before the
  // next round loads. Keep short so it still feels like a real captcha.
  advanceDelayMs: 700
};
/* ========================================================================= */

const state = { round: 0, selected: null, category: null };

const checkboxWidget = document.getElementById('checkboxWidget');
const challenge = document.getElementById('challenge');
const gridEl = document.getElementById('grid');
const msgEl = document.getElementById('msg');
const promptText = document.getElementById('promptText');
const debugBadge = document.getElementById('debugBadge');

// Pick this session's category, avoiding an immediate repeat of last time.
function pickCategory() {
  const cats = CONFIG.categories;
  const last = sessionStorage.getItem('lastCategory');
  let choices = cats;
  if (cats.length > 1 && last) {
    choices = cats.filter(c => c.name !== last);
  }
  const chosen = choices[Math.floor(Math.random() * choices.length)];
  sessionStorage.setItem('lastCategory', chosen.name);
  return chosen;
}

// digit -> 0-based grid index (row-major, 0..8), or null for "none"
function targetIndex(digit) {
  return digit === 0 ? null : digit - 1;
}

function shuffledSample(pool, n) {
  const arr = [...pool];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  while (arr.length < n) arr.push(pool[Math.floor(Math.random() * pool.length)]);
  return arr.slice(0, n);
}

function renderRound() {
  state.selected = null;
  msgEl.textContent = '';
  const cat = state.category;
  const emptyPool = cat.emptyImages && cat.emptyImages.length ? cat.emptyImages : CONFIG.defaultEmptyImages;
  const digit = cat.digitSequence[state.round];
  const target = targetIndex(digit);

  let tileImages = new Array(9);
  if (target === null) {
    tileImages = shuffledSample(emptyPool, 9);
  } else {
    const empties = shuffledSample(emptyPool, 8);
    const targetImg = cat.targetImages[Math.floor(Math.random() * cat.targetImages.length)];
    let e = 0;
    for (let i = 0; i < 9; i++) {
      tileImages[i] = (i === target) ? targetImg : empties[e++];
    }
  }

  gridEl.innerHTML = '';
  tileImages.forEach((src, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.index = i;
    tile.innerHTML = `
      <img src="${src}" alt="">
      <div class="tick">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>
      </div>`;
    tile.addEventListener('click', () => selectTile(i));
    gridEl.appendChild(tile);
  });

  updateDebugBadge(digit, target);
}

function selectTile(i) {
  document.querySelectorAll('#grid .tile').forEach(t => t.classList.remove('selected'));
  if (state.selected === i) {
    state.selected = null;
  } else {
    state.selected = i;
    gridEl.children[i].classList.add('selected');
  }
}

function verify() {
  const cat = state.category;
  const digit = cat.digitSequence[state.round];
  const target = targetIndex(digit);

  if (target === null) {
    fail(true);
    return;
  }

  if (state.selected === target) {
    succeed();
  } else {
    fail(false);
  }
}

function succeed() {
  msgEl.style.color = '#188038';
  msgEl.textContent = 'Verified.';
  setTimeout(() => { advanceRound(); }, CONFIG.advanceDelayMs);
}

function fail(autoAdvance) {
  msgEl.style.color = '#d93025';
  msgEl.textContent = 'Verification failed. Please try again.';
  if (autoAdvance) {
    setTimeout(() => { advanceRound(); }, CONFIG.advanceDelayMs);
  } else {
    document.querySelectorAll('#grid .tile').forEach(t => t.classList.remove('selected'));
    state.selected = null;
  }
}

function advanceRound() {
  state.round = (state.round + 1) % state.category.digitSequence.length;
  renderRound();
}

function updateDebugBadge(digit, target) {
  const params = new URLSearchParams(window.location.search);
  if (params.get('debug') === '1') {
    debugBadge.style.display = 'block';
    debugBadge.textContent =
      `[${state.category.name}] round ${state.round + 1}/${state.category.digitSequence.length} — digit: ${digit}` +
      (target === null ? ' (none)' : ` (index ${target})`);
  }
}

// Stage 1 -> Stage 2 transition
checkboxWidget.addEventListener('click', () => {
  checkboxWidget.classList.add('checking');
  checkboxWidget.querySelector('.spinner').style.display = 'inline-block';
  setTimeout(() => {
    checkboxWidget.style.display = 'none';
    challenge.style.display = 'block';
    state.category = pickCategory();
    state.round = 0;
    promptText.innerHTML = state.category.prompt;
    renderRound();
  }, 600);
});

document.getElementById('verifyBtn').addEventListener('click', verify);

// Cosmetic reshuffle of the current round's non-target images (does not
// change the round, digit, or category — purely so repeated reloads look plausible).
document.getElementById('reloadBtn').addEventListener('click', renderRound);
</script>
</body>
</html>
